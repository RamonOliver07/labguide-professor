<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LabGuide - Cadastro de Estudante</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --labguide-primary: #2B5D70;
            --labguide-dark: #1f4351;
        }

        body {
            background-color: #f4f7f6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .bg-labguide { background-color: var(--labguide-primary) !important; }
        .text-labguide { color: var(--labguide-primary) !important; }

        .btn-labguide {
            background-color: var(--labguide-primary);
            color: white;
            border: none;
            padding: 12px;
        }
        .btn-labguide:hover {
            background-color: var(--labguide-dark);
            color: white;
        }

        .form-control {
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #ced4da;
        }
        .form-control:focus {
            border-color: var(--labguide-primary);
            box-shadow: 0 0 0 0.25rem rgba(43, 93, 112, 0.25);
        }
    </style>
</head>
<body>

<!-- Header minimalista para mobile -->
<div class="bg-labguide text-white text-center py-3 shadow-sm mb-4">
    <h4 class="mb-0 fw-bold">🧪 LabGuide</h4>
</div>

<div class="container flex-grow-1">
    <div class="row justify-content-center">
        <div class="col-12 col-md-6 col-lg-4">

            <!-- Mensagem de Sucesso (Aparece após o aluno enviar o formulário) -->
            <div th:if="${sucesso}" class="alert alert-success text-center rounded-3 shadow-sm border-0 py-4">
                <h2 class="mb-3">🎉</h2>
                <h5 class="fw-bold">Cadastro Realizado!</h5>
                <p class="mb-0">Você foi matriculado na turma <strong th:text="${turma.nome}"></strong>.</p>
                <hr>
                <p class="small text-muted mb-0">Você já pode fechar esta página e fazer login no aplicativo do LabGuide no seu celular.</p>
            </div>

            <!-- Formulário de Cadastro (Escondido se o cadastro já deu certo) -->
            <div th:unless="${sucesso}" class="card shadow-sm border-0 rounded-4">
                <div class="card-body p-4">

                    <div class="text-center mb-4">
                        <h5 class="fw-bold text-dark">Cadastro de Estudante</h5>
                        <p class="text-muted small mb-0">Turma: <span class="badge bg-secondary fw-semibold fs-6" th:text="${turma.nome}">Turma X</span></p>
                        <p class="text-muted small">Professor: <span th:text="${turma.professor.nome}">Nome Prof</span></p>
                    </div>

                    <form th:action="@{/alunos/registro-mobile/salvar}" method="post">

                        <!-- ID da Turma oculto, enviado automaticamente junto com o formulário -->
                        <input type="hidden" name="turmaId" th:value="${turma.id}">

                        <div class="mb-3">
                            <label for="nome" class="form-label fw-semibold text-secondary small">Nome Completo</label>
                            <input type="text" class="form-control bg-light" id="nome" name="nome" placeholder="Digite seu nome" required>
                        </div>

                        <div class="mb-3">
                            <label for="matricula" class="form-label fw-semibold text-secondary small">Matrícula (IFG)</label>
                            <input type="number" class="form-control bg-light" id="matricula" name="matricula" placeholder="Ex: 2026205" required>
                        </div>

                        <div class="mb-4">
                            <label for="senha" class="form-label fw-semibold text-secondary small">Crie uma Senha para o App</label>
                            <input type="password" class="form-control bg-light" id="senha" name="senha" placeholder="Mínimo 6 caracteres" required>
                        </div>

                        <div class="d-grid mt-2">
                            <button type="submit" class="btn btn-labguide rounded-3 fw-bold fs-5 shadow-sm">Entrar na Turma</button>
                        </div>
                    </form>

                </div>
            </div>

        </div>
    </div>
</div>

<!-- Footer Minimalista -->
<div class="text-center py-3 mt-4 text-muted small">
    &copy; 2026 LabGuide - IFG Luziânia
</div>

</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LabGuide - Cadastrar Turma</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* ==========================================
           NOVA PALETA DE CORES DO SISTEMA (PROTÓTIPO)
           ========================================== */
        :root {
            --labguide-primary: #2B5D70; /* Cor principal cravada! */
            --labguide-dark: #1f4351;    /* Tom mais escuro para o hover do botão */
        }

        html, body { height: 100%; margin: 0; }
        body { background-color: #f8f9fa; display: flex; flex-direction: column; min-height: 100vh; }
        .main-content { flex: 1; }

        /* Classes padronizadas usando a variável de cor */
        .bg-labguide { background-color: var(--labguide-primary) !important; }
        .text-labguide { color: var(--labguide-primary) !important; }

        .btn-labguide {
            background-color: var(--labguide-primary);
            color: white;
            border: none;
        }
        .btn-labguide:hover {
            background-color: var(--labguide-dark);
            color: white;
        }

        /* Estilização suave para os campos de texto */
        .form-control:focus, .form-select:focus {
            border-color: var(--labguide-primary);
            box-shadow: 0 0 0 0.25rem rgba(43, 93, 112, 0.25);
        }
    </style>
</head>
<body class="bg-light">

<!-- NAVBAR PADRONIZADA COM A COR OFICIAL -->
<nav class="navbar navbar-expand-lg navbar-dark shadow-sm mb-4 bg-labguide">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">🧪 LabGuide</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <!-- Menu limpo, sem a aba de Professores para acesso comum -->
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item"><a class="nav-link fw-semibold" href="/alunos">Alunos</a></li>
                <li class="nav-item"><a class="nav-link fw-semibold" href="/turmas/novo">Turmas</a></li>
                <li class="nav-item"><a class="nav-link active fw-bold" href="/roteiros">Roteiros</a></li>
            </ul>
            <div class="d-flex align-items-center">
                <!-- Nome dinâmico do professor -->
                <span class="text-white fw-semibold me-3 d-none d-lg-block" th:text="'Olá, ' + ${#authentication.name}">Olá, Professor</span>
                <!-- Botão de Sair Seguro -->
                <form th:action="@{/logout}" method="post" class="m-0">
                    <button type="submit" class="btn btn-outline-light btn-sm fw-bold px-3">Sair</button>
                </form>
            </div>
        </div>
    </div>
</nav>

<div class="container main-content mb-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-5">

            <!-- NOVO ALERTA DE SUCESSO COM O LINK DE CONVITE -->
            <div th:if="${param.sucesso}" class="alert alert-success alert-dismissible fade show rounded-3 shadow-sm mt-4" role="alert">
                <h5 class="alert-heading fw-bold mb-2">🎉 Turma Criada com Sucesso!</h5>
                <p class="mb-2 text-dark">Compartilhe o link abaixo com seus alunos para que eles se cadastrem automaticamente nesta turma pelo celular:</p>

                <div class="input-group mb-2 shadow-sm">
                    <input type="text" class="form-control bg-white text-primary fw-semibold" id="linkConvite" readonly
                           th:value="'http://localhost:8080/alunos/registro-mobile?turma=' + ${param.turmaId}">
                    <button class="btn btn-success fw-bold" type="button" onclick="copiarLink()">📋 Copiar</button>
                </div>

                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <div class="card shadow-sm border-0 rounded-3 mt-4">
                <div class="card-body p-4 p-md-5">
                    <h3 class="card-title mb-4 text-center fw-bold text-labguide">Nova Turma</h3>

                    <form th:action="@{/turmas/salvar}" method="post">
                        <div class="mb-3">
                            <label for="nome" class="form-label fw-semibold text-secondary">Nome da Turma</label>
                            <input type="text" class="form-control bg-light border-0 shadow-sm text-dark" id="nome" name="nome" placeholder="Ex: 3º Ano A - Química" required>
                        </div>
                        <div class="mb-3">
                            <label for="anoLetivo" class="form-label fw-semibold text-secondary">Ano Letivo</label>
                            <input type="number" class="form-control bg-light border-0 shadow-sm text-dark" id="anoLetivo" name="anoLetivo" placeholder="Ex: 2026" required>
                        </div>
                        <div class="mb-4">
                            <label for="professorId" class="form-label fw-semibold text-secondary">Selecione o Professor</label>
                            <select class="form-select bg-light border-0 shadow-sm text-dark" id="professorId" name="professorId" required>
                                <option value="" disabled selected>Selecione o docente...</option>
                                <option th:each="prof : ${professores}" th:value="${prof.id}" th:text="${prof.nome}"></option>
                            </select>
                        </div>

                        <hr class="text-muted mt-4 mb-4">

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-labguide btn-lg rounded-3 fw-bold shadow-sm">Criar Turma</button>
                            <a href="/roteiros" class="btn btn-light rounded-3 fw-semibold border shadow-sm">Voltar para Roteiros</a>
                        </div>
                    </form>
                </div>
            </div>

        </div>
    </div>
</div>

<!-- (Mantenha o seu rodapé oficial aqui) -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // Função para copiar o link para a área de transferência
    function copiarLink() {
        var copyText = document.getElementById("linkConvite");
        copyText.select();
        copyText.setSelectionRange(0, 99999); // Para dispositivos móveis
        navigator.clipboard.writeText(copyText.value);

        // Dá um feedback visual no botão
        var btn = event.target;
        btn.innerText = "✅ Copiado!";
        btn.classList.replace("btn-success", "btn-outline-success");
        setTimeout(() => {
            btn.innerText = "📋 Copiar";
            btn.classList.replace("btn-outline-success", "btn-success");
        }, 3000);
    }
</script>
</body>
</html>
